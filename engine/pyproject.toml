[project]
name = "dieline-engine"
version = "0.1.0"
description = "Deterministic dieline engine and agent sidecar for Dieline Studio"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14,<3",
    "pydantic>=2.14,<3",
    "platformdirs>=4.14",
    "keyring>=25.7",
]

[project.scripts]
dieline-engine = "dieline_engine.__main__:main"

[dependency-groups]
dev = ["pytest>=9.2"]
bundle = ["pyinstaller>=6.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dieline_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
