# Builds the Windows installers on a Windows runner (PyInstaller can't
# cross-compile the engine sidecar). A pushed v* tag publishes a GitHub
# release; a manual run only uploads the installers as a workflow artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Engine tests
        working-directory: engine
        run: uv run pytest -q

      - name: Build engine sidecar
        shell: pwsh
        run: ./engine/scripts/build-sidecar.ps1

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test UI
        working-directory: app
        run: |
          pnpm typecheck
          pnpm test

      - name: Build installers
        working-directory: app
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
